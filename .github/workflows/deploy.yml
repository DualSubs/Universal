name: Deploy
on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - dev

permissions:
  actions: read
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/dev.yml
    secrets: inherit
  deploy:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact
      - name: Publish scripts, configuration and subscriptions together
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from "node:fs/promises";
          const names = ["Composite.Subtitles.response.dev.bundle.js", "External.Lyrics.response.dev.bundle.js", "Manifest.response.dev.bundle.js", "Translate.response.dev.bundle.js", "DualSubs.Universal.dev.sgmodule", "DualSubs.Universal.dev.plugin", "DualSubs.Universal.dev.stoverride", "DualSubs.Universal.dev.snippet", "DualSubs.Universal.dev.srmodule", "DualSubs.Universal.dev.yaml", "DualSubs.Universal.dev.boxjs.json", "DualSubs.Universal.dev.PreferencePanes.json", "config.dev.bundle.js", "DualSubs.Composite.dev.PreferencePanes.json", "config.Composite.dev.bundle.js", "DualSubs.Translate.dev.PreferencePanes.json", "config.Translate.dev.bundle.js", "DualSubs.External.dev.PreferencePanes.json", "config.External.dev.bundle.js", "DualSubs.API.Translate.dev.PreferencePanes.json", "config.API_Translate.dev.bundle.js", "DualSubs.API.External.dev.PreferencePanes.json", "config.API_External.dev.bundle.js"];
          const files = Object.fromEntries(await Promise.all(names.map(async name => [name, { content: await readFile(`dist/${name}`, "utf8") }])));
          await writeFile("gist-update.json", JSON.stringify({ description: "🍿️ DualSubs: 🔣 Universal β", files }));
          JS
          gh api --method PATCH gists/92cd6fbcde657fb43c67ed7f2430a994 --input gist-update.json --silent
